<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Docs Agent</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Docs Agent</h1>
      <section>
        <h2>Documentation</h2>
        <input
          id="google-doc-url"
          type="url"
          placeholder="Public Google Docs link"
        /><button id="save-docs-btn">Save Docs Link</button>
        <p id="docs-status">Not saved</p>
      </section>
      <section>
        <h2>Analyze a Pull Request</h2>
        <input
          id="pr-url"
          type="url"
          placeholder="https://github.com/owner/repo/pull/123"
        /><button id="save-pr-btn">Save PR</button>
        <p id="pr-status">Not saved</p>
      </section>
      <section id="suggestions-panel" class="hidden">
        <h2>Get Suggestions</h2>
        <button id="get-suggestions-btn">Get Suggestions</button>
        <p id="suggestions-status">No suggestions yet</p>
      </section>
      <section id="result-panel" class="hidden">
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
        <button id="copy-suggestion" class="hidden">Copy suggestion</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
